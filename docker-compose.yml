services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      secrets:
        - openai_api_key
    image: rag-app-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LANGFUSE_TRACING_ENVIRONMENT=production
    # restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: rag-frontend:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Not in .env, and must override any localhost value: inside the compose
      # network the API is reachable as the service name `api`.
      - API_BASE_URL=http://api:8000
      # Chat/session history lives here instead of the container's writable
      # layer, so it survives `docker compose down` + `up` recreation.
      - SESSIONS_FILE_PATH=/app/data/sessions.json
    volumes:
      - frontend_sessions:/app/data
    depends_on:
      - api

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    # restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - node-exporter
    # restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    # restart: unless-stopped

# Build-time secret sourced from the OPENAI_API_KEY shell variable. It is mounted
# only into `docker compose build` for the api image and never written into an
# image layer. Export it in the shell before building (see header).
secrets:
  openai_api_key:
    environment: OPENAI_API_KEY

# Named volumes for persistent local state: frontend chat sessions,
# Prometheus time-series data, and Grafana dashboards/settings.
volumes:
  frontend_sessions:
  prometheus_data:
  grafana_data: